name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libx11-dev libxcb1-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Package (copies the Qt runtime with windeployqt)
        run: cmake --install build --config Release --prefix dist
      - uses: actions/upload-artifact@v4
        with:
          name: soundboard-windows
          path: dist
